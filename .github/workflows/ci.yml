name: NightHawk checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q nighthawk-backend
      - name: Run unit tests
        working-directory: nighthawk-backend
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Three.js build dependencies
        working-directory: nighthawk-ui
        run: npm install --no-audit --no-fund
      - name: Build bundled Three.js renderer
        working-directory: nighthawk-ui
        run: npm run build
      - name: Validate frontend JavaScript syntax
        run: |
          node --check nighthawk-backend/static/app.js
          node --check nighthawk-backend/static/three-scene.js
