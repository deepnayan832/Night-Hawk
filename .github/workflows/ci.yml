name: NightHawk checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q nighthawk-backend
      - name: Run unit tests
        working-directory: nighthawk-backend
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Three.js build dependencies
        working-directory: nighthawk-ui
        run: npm install --no-audit --no-fund
      - name: Build bundled Three.js renderer
        working-directory: nighthawk-ui
        run: npm run build
      - name: Validate frontend JavaScript syntax
        run: |
          node --check nighthawk-backend/static/app.js
          node --check nighthawk-backend/static/three-scene.js

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Windows setup and full test suite
        shell: pwsh
        run: .\setup.ps1
      - name: Smoke-test local application on Windows
        shell: pwsh
        run: |
          $env:NIGHTHAWK_DATA_DIR = Join-Path $env:RUNNER_TEMP "nighthawk-smoke-data"
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          $backend = Join-Path $PWD "nighthawk-backend"
          $process = Start-Process -FilePath $python -ArgumentList @(
            "-m", "uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8765"
          ) -WorkingDirectory $backend -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Local FastAPI app did not start on Windows." }
            $home = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 5
            if ($home.StatusCode -ne 200) { throw "Local app home page did not return HTTP 200." }
            $scene = Invoke-WebRequest -Uri "http://127.0.0.1:8765/static/three-scene.js" -TimeoutSec 5
            if ($scene.StatusCode -ne 200) { throw "Three.js bundle is not served by the local app." }
            $project = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/project" -TimeoutSec 5
            if (-not $project.floors -or $project.floors.Count -lt 1) { throw "Default floor was not initialized." }
            $coverage = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/coverage/predicted?floor_id=floor_1&resolution=8" -TimeoutSec 10
            if ($coverage.kind -ne "theoretical_3d_model") { throw "Floor-aware RF endpoint smoke test failed." }
            Write-Host "Windows local app smoke test passed." -ForegroundColor Green
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
